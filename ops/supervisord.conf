; ops/supervisord.conf — the PolyEdge paper stack under ONE supervisor (Mac + Linux portable).
;
; Why supervisord over launchd/systemd here: one config file drives BOTH OSes, `supervisorctl status`
; is a one-glance process table, the inet server gives the /ops page (and you) an XML-RPC health API,
; and `supervisorctl stop desk:*` is a grouped stop. The honest systemd comparison lives in ops/README.md.
;
; Paths are env-derived so the SAME file works on a Linux VPS: %(ENV_HOME)s = your home dir,
; %(here)s = this ops/ directory (=> %(here)s/.. is the checkout). Conventions assumed:
;   venv at  ~/.venvs/polyedge        runtime data at  ~/polyedge-data
;
; PAPER ONLY: no .env is loaded here, LIVE_TRADING_ENABLED is never set — the live path stays
; double-locked (env flag + scoped PASS), exactly like the shipped systemd units.
;
; Start:  make ops-start      Stop: make ops-stop      Status: make ops-status
; Web UI: http://127.0.0.1:9100  (localhost only)      Ops page: http://127.0.0.1:8788/ops

[unix_http_server]
file=%(ENV_HOME)s/polyedge-data/supervisor.sock

[inet_http_server]
port=127.0.0.1:9100            ; localhost ONLY — never bind this to a public interface

[supervisord]
logfile=%(ENV_HOME)s/polyedge-data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(ENV_HOME)s/polyedge-data/supervisord.pid
childlogdir=%(ENV_HOME)s/polyedge-data/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/polyedge-data/supervisor.sock

; ── the desk stack ────────────────────────────────────────────────────────────────────────────────
; Shared shape: directory = the checkout; PATH puts the venv first; DESK_STRATEGY_CONFIG points at the
; PRIVATE sealed config OUTSIDE any git tree; stopasgroup/killasgroup so a stop never orphans children.

[program:capture]
command=%(ENV_HOME)s/.venvs/polyedge/bin/python3 -m desk.data.capture desk/capture_config.json
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",DESK_STRATEGY_CONFIG="%(ENV_HOME)s/polyedge-data/config/strategy_config.private.json",OMP_NUM_THREADS="2"
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=60                 ; let a poll/parquet flush finish before SIGKILL (default 10s is tight)
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/capture.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/capture.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=10

[program:strategydriver]
; The driver's own continuous mode (same invocation as the systemd unit / launchd plist): an internal
; loop with per-fire SIGALRM deadlines, singleton job lock, heartbeat — supervisord just keeps it alive.
command=%(ENV_HOME)s/.venvs/polyedge/bin/python3 -m desk.driver.strategy_driver
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",DESK_STRATEGY_CONFIG="%(ENV_HOME)s/polyedge-data/config/strategy_config.private.json",OMP_NUM_THREADS="2"
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=true
killasgroup=true
; A fire can legally run FIRE_DEADLINE_S=1200s; SIGTERM only sets the stop flag, the driver exits
; AFTER the in-flight fire + settle pass. The 10s default would SIGKILL a mid-fire driver (live:
; between the exchange POST and local persistence = dropped real exposure). 1260 = 1200 + margin.
stopwaitsecs=1260
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/strategydriver.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/strategydriver.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=20

[program:exitmonitor]
; The repo's design: exit_monitor runs ONE pass then exits (self-kills a network hang via its internal
; 180s SIGALRM); systemd reruns it with RestartSec=300. supervisord has no run-interval, so this loop
; wrapper reproduces the ~5-min cadence (and stamps a lastpass file the /ops page reads).
command=/bin/bash %(here)s/exitmonitor_loop.sh
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",DESK_STRATEGY_CONFIG="%(ENV_HOME)s/polyedge-data/config/strategy_config.private.json",OMP_NUM_THREADS="2"
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=60                 ; a mid-pass exit (IOC post + persist) gets to finish before SIGKILL
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/exitmonitor.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/exitmonitor.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=30

[program:dashboard]
command=%(ENV_HOME)s/.venvs/polyedge/bin/python3 -m desk.dashboard_server
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",DESK_STRATEGY_CONFIG="%(ENV_HOME)s/polyedge-data/config/strategy_config.private.json",OMP_NUM_THREADS="2"
autorestart=true
startsecs=5
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/dashboard.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/dashboard.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=40

[program:tenantdaily]
; Daily tenant substrate jobs (build_meta + gauge/v2 calibration extension) as ONE loop:
; data-dependent arms FAIL CLOSED when their rolling-calib substrate goes >7d stale, so a
; forward test without this bricks itself in a week.
; Self-healing: retries every 2h while degraded (e.g. Polymarket unreachable), daily once healthy.
command=/bin/bash %(here)s/tenant_daily_loop.sh
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",DESK_STRATEGY_CONFIG="%(ENV_HOME)s/polyedge-data/config/strategy_config.private.json",OMP_NUM_THREADS="2"
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/tenantdaily.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/tenantdaily.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=45

[program:caffeinate]
; OPTIONAL, macOS ONLY: -dims blocks display/idle/disk/system sleep while the stack runs, so a laptop
; doesn't idle-sleep the capture loop. On Linux this binary doesn't exist — the program just goes
; FATAL after its retries and the rest of the stack is unaffected; delete this block on a VPS
; (ops/README.md). Lid-close still sleeps a MacBook without external power/display — see README.
command=/usr/bin/caffeinate -dims
autorestart=true
startsecs=5
startretries=3
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/caffeinate.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/caffeinate.err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
priority=50

[program:notifier]
; The red-alert notifier (mission-control-v1 stage C): a 5-min loop on GET /api/health that pushes
; ntfy (and optional Telegram) on red conditions — capture/driver/exits stale, book-flow stalled
; (fresh heartbeat, flat book_rows: the proxy signature), substrate near its fail-closed gate, arm
; errors, PASS expiring, health endpoint dead twice — and a recovery line when each clears.
; Deliberately NOT in [group:desk]: `supervisorctl reread` + `add notifier` activates it without
; touching the running trading stack. Topic: env NTFY_TOPIC, else ~/polyedge-data/config/notifier.env
; (generated on first run — subscribe to it in the ntfy app; the topic is the subscription key).
command=%(ENV_HOME)s/.venvs/polyedge/bin/python3 -m desk.notifier
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",OMP_NUM_THREADS="2"
autostart=true
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/notifier.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/notifier.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=60

[program:capturevalidate]
; Capture validator (observe-only, ~30 min) + incremental compactor (bounded pass, ~10 min) — one
; loop, two entry points, split per architecture review B19 (validate never mutates; the compactor
; owns all merging). The compactor keeps the part-file count bounded (~65k new parquets/h otherwise
; pile up and wedge every store glob / ops scan). Deliberately NOT in [group:desk]: `supervisorctl
; reread` + `add capturevalidate` activates it without touching the running trading stack.
command=/bin/bash %(here)s/capture_validate_loop.sh
directory=%(here)s/..
environment=PATH="%(ENV_HOME)s/.venvs/polyedge/bin:%(ENV_PATH)s",DESK_STRATEGY_CONFIG="%(ENV_HOME)s/polyedge-data/config/strategy_config.private.json",OMP_NUM_THREADS="2"
autostart=true
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=60                 ; let an in-flight merge group finish (each group is atomic anyway)
stdout_logfile=%(ENV_HOME)s/polyedge-data/logs/capturevalidate.out.log
stderr_logfile=%(ENV_HOME)s/polyedge-data/logs/capturevalidate.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
priority=55

[group:desk]
programs=capture,strategydriver,exitmonitor,dashboard,tenantdaily
